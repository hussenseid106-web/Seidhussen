<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harbu Secondary School - API Connected Portal</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #10b981;
      --danger: #ef4444;
    }

    [data-theme="dark"] {
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
    }

    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    button {
      cursor: pointer;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text);
      font-weight: 600;
      transition: all 0.2s;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button.btn-primary {
      background-color: var(--primary);
      color: white;
      border: none;
    }

    button.btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    button.btn-danger {
      background-color: var(--danger);
      color: white;
      border: none;
    }

    .container {
      max-width: 950px;
      margin: 2rem auto;
      padding: 0 1rem;
      width: 100%;
      flex: 1;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 2rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .hidden { display: none !important; }

    /* Tabs */
    .role-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }

    .tab-btn {
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 1rem;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
    }

    .tab-btn.active {
      background-color: var(--primary);
      color: white;
    }

    /* Forms */
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.875rem; color: var(--text-muted); }
    input, select {
      width: 100%;
      padding: 0.75rem;
      border-radius: 0.375rem;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }

    .error-msg { color: var(--danger); font-size: 0.875rem; margin-top: 0.5rem; }

    /* Tables & Badges */
    table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 1rem; }
    th, td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
    th { background-color: var(--bg); color: var(--text-muted); font-size: 0.875rem; }

    .badge { padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; font-weight: 700; }
    .badge-pass { background-color: #dcfce7; color: #15803d; }
    .badge-fail { background-color: #fee2e2; color: #b91c1c; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      background-color: var(--card-bg);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">Harbu Secondary School</div>
    <div class="controls">
      <button id="themeToggleBtn" onclick="toggleTheme()">Dark Mode</button>
      <button id="logoutBtn" class="hidden" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="container">
    
    <!-- LOGIN PORTAL -->
    <div id="loginCard" class="card">
      <div class="role-tabs">
        <button id="tabStudent" class="tab-btn active" onclick="switchRole('student')">Student Login</button>
        <button id="tabTeacher" class="tab-btn" onclick="switchRole('teacher')">Teacher / Admin Portal</button>
      </div>

      <!-- Student Login Form -->
      <form id="studentLoginForm" onsubmit="handleStudentLogin(event)">
        <div class="form-group">
          <label for="studentFirstName">First Name (Username)</label>
          <input type="text" id="studentFirstName" placeholder="e.g. abebe" required>
        </div>
        <div class="form-group">
          <label for="studentPassword">Password</label>
          <input type="password" id="studentPassword" placeholder="Enter password" required>
        </div>
        <div id="studentLoginError" class="error-msg hidden"></div>
        <button type="submit" id="studentLoginBtn" class="btn-primary" style="width: 100%;">Login as Student</button>
      </form>

      <!-- Teacher Login Form -->
      <form id="teacherLoginForm" class="hidden" onsubmit="handleTeacherLogin(event)">
        <div class="form-group">
          <label for="adminUsername">Teacher Username</label>
          <input type="text" id="adminUsername" placeholder="e.g. admin" required>
        </div>
        <div class="form-group">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" placeholder="Enter admin password" required>
        </div>
        <div id="teacherLoginError" class="error-msg hidden"></div>
        <button type="submit" id="teacherLoginBtn" class="btn-primary" style="width: 100%;">Login as Teacher</button>
      </form>
    </div>

    <!-- STUDENT DASHBOARD -->
    <div id="studentDashboardCard" class="card hidden">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:1rem; margin-bottom:1.5rem;">
        <div>
          <h2 id="studentNameDisplay">Student Name</h2>
          <p id="studentMeta" style="color: var(--text-muted); font-size: 0.875rem;">Grade -- | Section --</p>
        </div>
        <button onclick="window.print()">Print Report</button>
      </div>

      <table>
        <thead>
          <tr><th>Subject</th><th>Score</th><th>Grade</th><th>Status</th></tr>
        </thead>
        <tbody id="studentResultsBody"></tbody>
      </table>
    </div>

    <!-- TEACHER / ADMIN DASHBOARD -->
    <div id="teacherDashboardCard" class="card hidden">
      <h2>Teacher Management Portal</h2>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Manage MongoDB student records and academic grades</p>

      <div class="grid-2">
        <div>
          <label for="studentSelect">Select Student to Manage</label>
          <select id="studentSelect" onchange="loadStudentForEditing()">
            <option value="">-- Select Student --</option>
          </select>
        </div>
        <div style="display:flex; align-items:flex-end;">
          <button class="btn-primary" onclick="handleRegisterStudent()">+ Register New Student</button>
        </div>
      </div>

      <div id="editorSection" class="hidden" style="margin-top: 2rem; border-top: 1px solid var(--border); padding-top: 1rem;">
        <h3 id="selectedStudentTitle">Editing Grades</h3>
        
        <table>
          <thead>
            <tr><th>Subject</th><th>Score (0-100)</th><th>Actions</th></tr>
          </thead>
          <tbody id="adminGradesBody"></tbody>
        </table>

        <!-- Add New Subject Form -->
        <div style="margin-top: 1.5rem; background: var(--bg); padding: 1rem; border-radius: 0.375rem;">
          <h4>Add / Update Subject Score</h4>
          <form onsubmit="handleAddOrUpdateGrade(event)" class="grid-2" style="margin-top: 0.5rem;">
            <input type="text" id="newSubjectName" placeholder="Subject Name (e.g. Chemistry)" required>
            <input type="number" id="newSubjectScore" min="0" max="100" placeholder="Score" required>
            <button type="submit" class="btn-primary" style="grid-column: span 2;">Save Grade to Server</button>
          </form>
        </div>
      </div>
    </div>

  </div>

  <footer>
    &copy; <span id="year"></span> Harbu Secondary School API System
  </footer>

  <script>
    const API_BASE_URL = "http://localhost:5000/api";

    let activeRole = 'student';
    let currentAuthToken = null;
    let studentsCache = [];
    let selectedStudent = null;

    document.getElementById("year").textContent = new Date().getFullYear();

    function toggleTheme() {
      const newTheme = document.body.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.body.setAttribute("data-theme", newTheme);
      document.getElementById("themeToggleBtn").textContent = newTheme === "dark" ? "Light Mode" : "Dark Mode";
    }

    function switchRole(role) {
      activeRole = role;
      document.getElementById("tabStudent").classList.toggle("active", role === 'student');
      document.getElementById("tabTeacher").classList.toggle("active", role === 'teacher');
      document.getElementById("studentLoginForm").classList.toggle("hidden", role !== 'student');
      document.getElementById("teacherLoginForm").classList.toggle("hidden", role !== 'teacher');
    }

    /* API - STUDENT LOGIN */
    async function handleStudentLogin(e) {
      e.preventDefault();
      const username = document.getElementById("studentFirstName").value.trim();
      const password = document.getElementById("studentPassword").value;
      const errorDiv = document.getElementById("studentLoginError");
      const btn = document.getElementById("studentLoginBtn");

      errorDiv.classList.add("hidden");
      btn.disabled = true;

      try {
        const response = await fetch(`${API_BASE_URL}/auth/student-login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Login failed');
        }

        currentAuthToken = data.token;
        renderStudentDashboard(data.student);
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove("hidden");
      } finally {
        btn.disabled = false;
      }
    }

    /* API - TEACHER LOGIN */
    async function handleTeacherLogin(e) {
      e.preventDefault();
      const username = document.getElementById("adminUsername").value.trim();
      const password = document.getElementById("adminPassword").value;
      const errorDiv = document.getElementById("teacherLoginError");
      const btn = document.getElementById("teacherLoginBtn");

      errorDiv.classList.add("hidden");
      btn.disabled = true;

      try {
        const response = await fetch(`${API_BASE_URL}/auth/teacher-login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Authentication failed');
        }

        currentAuthToken = data.token;
        await fetchAndRenderTeacherPortal();
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.classList.remove("hidden");
      } finally {
        btn.disabled = false;
      }
    }

    /* RENDER STUDENT DASHBOARD */
    function renderStudentDashboard(student) {
      document.getElementById("loginCard").classList.add("hidden");
      document.getElementById("studentDashboardCard").classList.remove("hidden");
      document.getElementById("logoutBtn").classList.remove("hidden");

      document.getElementById("studentNameDisplay").textContent = student.fullName;
      document.getElementById("studentMeta").textContent = `Grade ${student.grade} | Section ${student.section}`;

      const tbody = document.getElementById("studentResultsBody");
      tbody.innerHTML = "";
      
      if (!student.results || student.results.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">No subject grades recorded yet.</td></tr>`;
        return;
      }

      student.results.forEach(res => {
        const isPass = res.score >= 50;
        tbody.innerHTML += `
          <tr>
            <td><strong>${res.subject}</strong></td>
            <td>${res.score}/100</td>
            <td>${res.grade}</td>
            <td><span class="badge ${isPass ? 'badge-pass' : 'badge-fail'}">${isPass ? 'PASS' : 'FAIL'}</span></td>
          </tr>
        `;
      });
    }

    /* API - FETCH ALL STUDENTS FOR TEACHER PORTAL */
    async function fetchAndRenderTeacherPortal() {
      document.getElementById("loginCard").classList.add("hidden");
      document.getElementById("teacherDashboardCard").classList.remove("hidden");
      document.getElementById("logoutBtn").classList.remove("hidden");

      try {
        const response = await fetch(`${API_BASE_URL}/students`);
        studentsCache = await response.json();

        const select = document.getElementById("studentSelect");
        select.innerHTML = `<option value="">-- Choose Student --</option>`;
        studentsCache.forEach(s => {
          select.innerHTML += `<option value="${s._id}">${s.fullName} (${s.username.toUpperCase()}) - Grade ${s.grade}</option>`;
        });
      } catch (err) {
        alert("Failed to connect to backend server.");
      }
    }

    function loadStudentForEditing() {
      const id = document.getElementById("studentSelect").value;
      selectedStudent = studentsCache.find(s => s._id === id);
      const editor = document.getElementById("editorSection");

      if (!selectedStudent) {
        editor.classList.add("hidden");
        return;
      }

      editor.classList.remove("hidden");
      document.getElementById("selectedStudentTitle").textContent = `Editing Record: ${selectedStudent.fullName}`;
      renderAdminGradesTable(selectedStudent.results);
    }

    function renderAdminGradesTable(results) {
      const tbody = document.getElementById("adminGradesBody");
      tbody.innerHTML = "";
      
      if (!results || results.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" style="text-align:center;">No subject grades assigned yet.</td></tr>`;
        return;
      }

      results.forEach(item => {
        tbody.innerHTML += `
          <tr>
            <td>${item.subject}</td>
            <td><strong>${item.score}/100</strong> (${item.grade})</td>
            <td>
              <button class="btn-danger" onclick="deleteGradeApi('${item._id}')">Remove</button>
            </td>
          </tr>
        `;
      });
    }

    /* API - ADD/UPDATE GRADE */
    async function handleAddOrUpdateGrade(e) {
      e.preventDefault();
      if (!selectedStudent) return;

      const subject = document.getElementById("newSubjectName").value.trim();
      const score = parseInt(document.getElementById("newSubjectScore").value);

      try {
        const response = await fetch(`${API_BASE_URL}/students/${selectedStudent._id}/grades`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ subject, score })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.message);

        selectedStudent.results = data.results;
        renderAdminGradesTable(data.results);
        document.getElementById("newSubjectName").value = "";
        document.getElementById("newSubjectScore").value = "";
      } catch (err) {
        alert("Failed to save grade: " + err.message);
      }
    }

    /* API - DELETE GRADE */
    async function deleteGradeApi(subjectId) {
      if (!selectedStudent || !confirm("Are you sure you want to remove this grade?")) return;

      try {
        const response = await fetch(`${API_BASE_URL}/students/${selectedStudent._id}/grades/${subjectId}`, {
          method: 'DELETE'
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.message);

        selectedStudent.results = data.results;
        renderAdminGradesTable(data.results);
      } catch (err) {
        alert("Failed to delete grade: " + err.message);
      }
    }

    /* API - REGISTER NEW STUDENT */
    async function handleRegisterStudent() {
      const username = prompt("Enter Student Username (e.g. tigist):");
      if (!username) return;

      const fullName = prompt("Enter Full Name:", "Tigist Haile");
      const password = prompt("Assign Password:", "1234");
      const grade = prompt("Assign Grade Level:", "12");

      try {
        const response = await fetch(`${API_BASE_URL}/students`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, fullName, password, grade, section: "A" })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.message);

        alert("Student registered successfully!");
        await fetchAndRenderTeacherPortal();
        document.getElementById("studentSelect").value = data.student._id;
        loadStudentForEditing();
      } catch (err) {
        alert("Error creating student: " + err.message);
      }
    }

    function logout() {
      currentAuthToken = null;
      selectedStudent = null;
      document.getElementById("studentLoginForm").reset();
      document.getElementById("teacherLoginForm").reset();
      document.getElementById("studentDashboardCard").classList.add("hidden");
      document.getElementById("teacherDashboardCard").classList.add("hidden");
      document.getElementById("loginCard").classList.remove("hidden");
      document.getElementById("logoutBtn").classList.add("hidden");
    }
  </script>
</body>
</html>
