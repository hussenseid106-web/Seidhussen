<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harbu Secondary School - Official Transcript Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white max-w-lg w-full rounded-2xl shadow-xl p-6 border border-slate-200">
    <!-- Header -->
    <div class="text-center pb-4 border-b border-slate-200">
      <div class="inline-block bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full mb-2">
        ✓ OFFICIAL VERIFIED RECORD
      </div>
      <h2 class="text-xl font-black text-slate-800">Harbu Secondary School</h2>
      <p class="text-xs text-slate-500">Ministry of Education Academic Record Verification</p>
    </div>

    <!-- Dynamic Content -->
    <div id="loading" class="py-10 text-center text-sm font-semibold text-slate-500">
      Verifying record with official database...
    </div>

    <div id="verifiedData" class="hidden space-y-4 pt-4">
      <div class="flex items-center space-x-4 bg-slate-50 p-3 rounded-xl border border-slate-200">
        <div id="vAvatar" class="w-14 h-14 rounded-xl bg-indigo-100 flex items-center justify-center font-bold text-indigo-600 text-lg"></div>
        <div>
          <h3 id="vName" class="font-bold text-slate-900 text-base"></h3>
          <p id="vMeta" class="text-xs text-slate-500"></p>
          <p id="vSerial" class="text-[11px] font-mono text-indigo-600 font-semibold"></p>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3 text-center">
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
          <p class="text-[10px] text-slate-400 font-bold uppercase">Total Average</p>
          <p id="vAvg" class="text-lg font-black text-indigo-600"></p>
        </div>
        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
          <p class="text-[10px] text-slate-400 font-bold uppercase">Academic Status</p>
          <p id="vStatus" class="text-lg font-black text-emerald-600"></p>
        </div>
      </div>

      <div>
        <h4 class="text-xs font-bold text-slate-500 uppercase mb-2">Subject Performance</h4>
        <div id="vGradesTable" class="divide-y divide-slate-200 border rounded-xl overflow-hidden text-xs"></div>
      </div>
    </div>

    <div id="errorMsg" class="hidden py-8 text-center text-red-500 text-sm font-bold">
      ⚠️ Invalid or fraudulent transcript code. Record not found.
    </div>
  </div>

  <script>
    const API_BASE_URL = "https://school-result-backend.onrender.com/api";
    const urlParams = new URLSearchParams(window.location.search);
    const studentId = urlParams.get('id');

    async function verifyTranscript() {
      if (!studentId) {
        showError();
        return;
      }
      try {
        const res = await fetch(`${API_BASE_URL}/students/${studentId}`);
        if (!res.ok) throw new Error();
        const student = await res.json();

        document.getElementById("loading").classList.add("hidden");
        document.getElementById("verifiedData").classList.remove("hidden");

        document.getElementById("vName").textContent = student.fullName;
        document.getElementById("vMeta").textContent = `Grade ${student.grade || '9'} - Section ${student.section || 'A'}`;
        document.getElementById("vSerial").textContent = `ID: HSS-TR-2026-${student._id.substring(student._id.length - 6).toUpperCase()}`;
        document.getElementById("vAvatar").textContent = student.fullName.substring(0, 2).toUpperCase();

        const results = student.results || [];
        let total = 0;
        let tableHTML = "";

        results.forEach(r => {
          total += Number(r.score) || 0;
          tableHTML += `
            <div class="flex justify-between p-2.5 bg-white">
              <span class="font-medium text-slate-700">${r.subject}</span>
              <span class="font-bold text-indigo-600">${r.score} / 100 (${r.grade || '-'})</span>
            </div>
          `;
        });

        const avg = results.length > 0 ? (total / results.length).toFixed(1) : "0";
        document.getElementById("vAvg").textContent = `${avg}%`;
        document.getElementById("vStatus").textContent = avg >= 50 ? "PASSED" : "FAILED";
        document.getElementById("vGradesTable").innerHTML = tableHTML;

      } catch (err) {
        showError();
      }
    }

    function showError() {
      document.getElementById("loading").classList.add("hidden");
      document.getElementById("errorMsg").classList.remove("hidden");
    }

    verifyTranscript();
  </script>
</body>
</html>
